name: Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://erp_user:erp_password@localhost:5432/mini_erp?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend db:generate

      - name: Run backend tests
        run: pnpm test

      - name: Build all applications
        run: pnpm build

      - name: Validate full-stack Docker setup
        run: |
          docker compose config --quiet
          docker build --file apps/backend/Dockerfile --tag stockflow-backend:ci .
          docker build --file apps/frontend/Dockerfile --tag stockflow-frontend:ci .

  deploy-aws:
    name: Deploy to AWS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: "337513903682"
      ECR_REPOSITORY: stockflow-api
      STACK_NAME: stockflow-production
      PRODUCT_IMAGE_BUCKET: stockflow-product-images-prod-hr211

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::337513903682:role/StockFlowGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish backend image
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --file apps/backend/Dockerfile.lambda --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Install application dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install packages and apply database migrations
        env:
          DATABASE_URL: ${{ secrets.AWS_DIRECT_DATABASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter backend exec prisma migrate deploy

      - name: Deploy AWS application stack
        env:
          DATABASE_URL: ${{ secrets.AWS_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.AWS_JWT_SECRET }}
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws-app.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BackendImageUri="$IMAGE_URI" \
              DatabaseUrl="$DATABASE_URL" \
              JwtSecret="$JWT_SECRET" \
              ProductImageBucket="$PRODUCT_IMAGE_BUCKET"

      - name: Read deployment outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Allow the AWS frontend to upload product images
        run: |
          cat > "$RUNNER_TEMP/product-image-cors.json" <<JSON
          {
            "CORSRules": [
              {
                "AllowedOrigins": [
                  "$API_URL",
                  "https://stockflow-finance.vercel.app",
                  "http://localhost:5173",
                  "http://localhost:8080"
                ],
                "AllowedMethods": ["GET", "HEAD", "PUT"],
                "AllowedHeaders": ["*"],
                "ExposeHeaders": ["ETag"],
                "MaxAgeSeconds": 3000
              }
            ]
          }
          JSON
          aws s3api put-bucket-cors --bucket "$PRODUCT_IMAGE_BUCKET" --cors-configuration "file://$RUNNER_TEMP/product-image-cors.json"

      - name: Verify AWS production
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$API_URL/health"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$API_URL/" >/dev/null
