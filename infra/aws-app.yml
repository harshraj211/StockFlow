AWSTemplateFormatVersion: "2010-09-09"
Description: StockFlow React frontend and Express API on API Gateway and Lambda.

Parameters:
  BackendImageUri:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
  ProductImageBucket:
    Type: String
    Default: stockflow-product-images-prod-hr211

Resources:
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stockflow-lambda-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ProductImageObjects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProductImageBucket}/products/*

  BackendFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: stockflow-api-production
      PackageType: Image
      Code:
        ImageUri: !Ref BackendImageUri
      Role: !GetAtt BackendRole.Arn
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRES_IN: 8h
          FRONTEND_URL: https://stockflow-finance.vercel.app
          SERVE_FRONTEND: "true"
          AWS_S3_BUCKET: !Ref ProductImageBucket
      Tags:
        - Key: Application
          Value: StockFlow

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/stockflow-api-production
      RetentionInDays: 14

  BackendApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: stockflow-api-production
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowOrigins:
          - https://stockflow-finance.vercel.app
        MaxAge: 600

  BackendIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BackendApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  BackendRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BackendApi
      RouteKey: $default
      Target: !Sub integrations/${BackendIntegration}

  BackendStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BackendApi
      StageName: $default
      AutoDeploy: true

  BackendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BackendApi}/*

Outputs:
  ApiUrl:
    Value: !GetAtt BackendApi.ApiEndpoint
  FrontendUrl:
    Value: !GetAtt BackendApi.ApiEndpoint
